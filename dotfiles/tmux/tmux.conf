unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

bind m resize-pane -Z
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 10000
set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=#666666"
set -g status-justify right
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 60
set -g status-right "#S "

setw -g window-status-format "#I:#W "
setw -g window-status-current-format "#[fg=#ffffff,bold]#I:#W#[fg=#666666] "

set -g pane-border-status off
set -g pane-border-style "fg=#222222"
set -g pane-active-border-style "fg=#555555"

set -g message-style "bg=#333333,fg=#ffffff"
setw -g mode-style "bg=#333333,fg=#ffffff"
