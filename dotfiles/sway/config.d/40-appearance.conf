bar {
  position bottom

  status_command while date +'%Y-%m-%d %X'; do sleep 1; done

  colors {
    statusline #ffffff
    background #000000
    separator  #27272a
    focused_workspace  #5e7867 #90b99f #000000
    active_workspace   #27272a #27272a #ffffff
    inactive_workspace #000000 #000000 #666666
    urgent_workspace   #f5a191 #f5a191 #000000
    binding_mode       #aca1cf #aca1cf #000000
  }
}

client.focused_inactive #27272a #000000 #888888 #27272a #27272a
client.unfocused        #27272a #000000 #888888 #27272a #27272a
client.urgent           #f5a191 #000000 #ffffff #f5a191 #f5a191
client.placeholder      #27272a #000000 #888888 #27272a #27272a
client.focused          #5e7867 #90b99f #000000 #90b99f #5e7867

gaps inner 2
gaps outer 2
