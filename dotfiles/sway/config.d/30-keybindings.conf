bindsym $mod+Return exec $term
bindsym $mod+Shift+q kill
bindsym $mod+d exec $menu
floating_modifier $mod normal
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'

bindsym $mod+Shift+x exec swaylock -f -c 000000

bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

bindsym $mod+b splith
bindsym $mod+v splitv
bindsym $mod+s layout stacking
bindsym $mod+w splitv, layout tabbed
bindsym $mod+Shift+t layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+f fullscreen

bindsym $mod+Shift+f floating toggle
bindsym $mod+g focus mode_toggle

bindsym $mod+a focus parent

bindsym $mod+Tab focus next sibling
bindsym $mod+Shift+Tab focus prev sibling

bindsym $mod+Ctrl+1 exec ~/.config/sway/scripts/focus-tab.sh 1
bindsym $mod+Ctrl+2 exec ~/.config/sway/scripts/focus-tab.sh 2
bindsym $mod+Ctrl+3 exec ~/.config/sway/scripts/focus-tab.sh 3
bindsym $mod+Ctrl+4 exec ~/.config/sway/scripts/focus-tab.sh 4
bindsym $mod+Ctrl+5 exec ~/.config/sway/scripts/focus-tab.sh 5
bindsym $mod+Ctrl+6 exec ~/.config/sway/scripts/focus-tab.sh 6
bindsym $mod+Ctrl+7 exec ~/.config/sway/scripts/focus-tab.sh 7
bindsym $mod+Ctrl+8 exec ~/.config/sway/scripts/focus-tab.sh 8
bindsym $mod+Ctrl+9 exec ~/.config/sway/scripts/focus-tab.sh 9

bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

mode "resize" {
  bindsym $left resize shrink width 10px
  bindsym $down resize grow height 10px
  bindsym $up resize shrink height 10px
  bindsym $right resize grow width 10px
  bindsym Left resize shrink width 10px
  bindsym Down resize grow height 10px
  bindsym Up resize shrink height 10px
  bindsym Right resize grow width 10px
  bindsym Return mode "default"
  bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"

bindsym --locked XF86AudioMute exec pactl set-sink-mute \@DEFAULT_SINK@ toggle && ~/.config/sway/scripts/volume.sh
bindsym --locked XF86AudioLowerVolume exec pactl set-sink-volume \@DEFAULT_SINK@ -5% && ~/.config/sway/scripts/volume.sh
bindsym --locked XF86AudioRaiseVolume exec pactl set-sink-volume \@DEFAULT_SINK@ +5% && ~/.config/sway/scripts/volume.sh
bindsym --locked XF86AudioMicMute exec pactl set-source-mute \@DEFAULT_SOURCE@ toggle && ~/.config/sway/scripts/mic.sh
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioPrev exec playerctl previous
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioStop exec playerctl stop
bindsym --locked XF86MonBrightnessDown exec ~/.config/sway/scripts/brightness.sh 5%-
bindsym --locked XF86MonBrightnessUp exec ~/.config/sway/scripts/brightness.sh 5%+

bindsym Print exec bash -c 'n=$(ls ~/Pictures/screenshots/*.png 2>/dev/null | wc -l); grim ~/Pictures/screenshots/$(printf "%03d" $((n+1)))-$(date +%d%m%y-%H%M%S).png && notify-send -a "system" "" "Screenshot saved"'

bindsym $mod+Shift+s exec bash -c 'n=$(ls ~/Pictures/screenshots/*.png 2>/dev/null | wc -l); grim -g "$(slurp)" - | tee ~/Pictures/screenshots/$(printf "%03d" $((n+1)))-$(date +%d%m%y-%H%M%S).png | wl-copy && notify-send -a "system" "" "Screenshot saved & copied"'

bindsym F9 exec pkill -SIGINT wf-recorder && notify-send -a "system" "" "Recording stopped" || (bash -c 'n=$(ls ~/Videos/recordings/*.mp4 2>/dev/null | wc -l); wf-recorder --audio=alsa_output.pci-0000_00_1f.3.analog-stereo.monitor -C aac -f ~/Videos/recordings/$(printf "%03d" $((n+1)))-$(date +%d%m%y-%H%M%S).mp4' & notify-send -a "system" "" "Recording started")

bindsym $mod+Shift+r exec pkill -SIGINT wf-recorder && notify-send -a "system" "" "Recording stopped" || (bash -c 'n=$(ls ~/Videos/recordings/*.mp4 2>/dev/null | wc -l); wf-recorder -g "$(slurp)" --audio=alsa_output.pci-0000_00_1f.3.analog-stereo.monitor -C aac -f ~/Videos/recordings/$(printf "%03d" $((n+1)))-$(date +%d%m%y-%H%M%S).mp4' & notify-send -a "system" "" "Recording area select")
